name: Build and push FinSight images

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: finsightregistry61459.azurecr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name finsightregistry61459

      - name: Build API image
        run: docker build -f deploy/api.Dockerfile -t "$REGISTRY/finsight-api:${GITHUB_SHA}" .

      - name: Push API image
        run: docker push "$REGISTRY/finsight-api:${GITHUB_SHA}"

      - name: Build worker image
        run: docker build -f deploy/worker.Dockerfile -t "$REGISTRY/finsight-worker:${GITHUB_SHA}" .

      - name: Push worker image
        run: docker push "$REGISTRY/finsight-worker:${GITHUB_SHA}"

      - name: Build frontend image
        run: docker build -f deploy/web.Dockerfile -t "$REGISTRY/finsight-web:${GITHUB_SHA}" .

      - name: Push frontend image
        run: docker push "$REGISTRY/finsight-web:${GITHUB_SHA}"
